<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Drawer - Рисование SVG</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .svg-container { border: 1px solid #ddd; padding: 20px; margin: 20px 0; text-align: center; }
    .info { background: #f5f5f5; padding: 15px; border-radius: 5px; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
<h1>Сервис рисования SVG</h1>

<div th:if="${error}" class="error">
  <p th:text="${error}"></p>
</div>

<div th:if="${svg}">
  <div class="info">
    <p><strong>Входной параметр:</strong> <span th:text="${num}"></span></p>
    <p><strong>Форма:</strong> <span th:text="${shape}"></span></p>
    <p><strong>Цвет:</strong> <span th:text="${color}"></span></p>
    <p><strong>Размер:</strong> <span th:text="${size}"></span></p>
  </div>

  <div class="svg-container">
    <div th:utext="${svg}"></div>
  </div>
</div>

<form action="/drawer" method="get">
  <label for="num">Введите число (0-255):</label>
  <input type="number" id="num" name="num" min="0" max="255" required>
  <button type="submit">Нарисовать</button>
</form>
</body>
</html>
