<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Информация о сервере</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 50px auto; padding: 20px; }
    .info-item { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
    .info-label { font-weight: bold; color: #333; margin-bottom: 5px; }
    .info-value { background: white; padding: 10px; border: 1px solid #ddd; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
<h1>Информация о сервере</h1>

<div th:each="entry : ${serverInfo}" class="info-item">
  <div class="info-label" th:text="${entry.key}"></div>
  <div class="info-value" th:text="${entry.value}"></div>
</div>
</body>
</html>
